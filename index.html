<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ant Tracker Pro - Intelligence Edition</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
        }

        canvas,
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #motionCanvas {
            z-index: 10;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* Focus Ring Animation */
        #focus-ring {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 2px solid #00ff88;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(2);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            pointer-events: none;
            z-index: 15;
        }

        .controls {
            margin-top: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            width: 100%;
            accent-color: #00ff88;
            margin-top: 5px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            background: #3d3d3d;
            color: white;
            transition: all 0.2s;
        }

        button.active {
            background: #00ff88;
            color: black;
        }

        .btn-power {
            background: #ff453a;
        }

        .btn-power.on {
            background: #32d74b;
            color: black;
        }

        #status-bar {
            width: 100%;
            max-width: 640px;
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <div id="status-bar">
        <span>ANT TRACKER V2.1</span>
        <span id="status">INITIALIZING...</span>
    </div>

    <div class="container" id="video-wrapper" onclick="handleTapToFocus(event)">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="motionCanvas"></canvas>
        <div id="focus-ring"></div>
    </div>

    <div class="controls">
        <div class="full-width">
            <label>Sensitivity <span id="v-thresh">30</span></label>
            <input type="range" id="threshold" min="5" max="100" value="30">
        </div>

        <button id="torchBtn" onclick="toggleTorch()">Torch: OFF</button>
        <button id="focusBtn" onclick="toggleFocusMode()">Focus: Auto</button>

        <button onclick="clearHeatmap()">Clear Heat</button>
        <button id="powerBtn" class="btn-power" onclick="togglePower()">Camera: OFF</button>

        <div class="full-width">
            <label>Heat Intensity <span id="v-intens">150</span></label>
            <input type="range" id="intensity" min="50" max="255" value="150">
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const powerBtn = document.getElementById('powerBtn');
        const torchBtn = document.getElementById('torchBtn');
        const focusBtn = document.getElementById('focusBtn');
        const focusRing = document.getElementById('focus-ring');

        let prevImageData = null;
        let stream = null;
        let track = null;
        let isRunning = false;
        let isFlashOn = false;
        let isFocusLocked = false;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 } },
                    audio: false
                });
                video.srcObject = stream;
                track = stream.getVideoTracks()[0];

                await video.play();

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                isRunning = true;
                updateUIState(true);
                processFrame();
            } catch (err) {
                document.getElementById('status').innerText = "CAMERA ERROR";
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            isRunning = false;
            updateUIState(false);
        }

        function updateUIState(on) {
            powerBtn.innerText = on ? "Camera: ON" : "Camera: OFF";
            powerBtn.className = on ? "btn-power on" : "btn-power";
            document.getElementById('status').innerText = on ? "LIVE" : "POWER SAVE";
        }

        function togglePower() { isRunning ? stopCamera() : startCamera(); }

        // --- INTELLIGENT CAMERA CONTROLS ---

        async function toggleTorch() {
            if (!track) return;
            const caps = track.getCapabilities();
            if (!caps.torch) return alert("Torch not supported.");
            isFlashOn = !isFlashOn;
            await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
            torchBtn.innerText = isFlashOn ? "Torch: ON" : "Torch: OFF";
            torchBtn.classList.toggle('active', isFlashOn);
        }

        async function toggleFocusMode() {
            if (!track) return;
            isFocusLocked = !isFocusLocked;
            const mode = isFocusLocked ? "manual" : "continuous";
            await track.applyConstraints({ advanced: [{ focusMode: mode }] });
            focusBtn.innerText = isFocusLocked ? "Focus: Locked" : "Focus: Auto";
            focusBtn.classList.toggle('active', isFocusLocked);
        }

        async function handleTapToFocus(e) {
            if (!track || !isRunning) return;

            // Show Focus Ring Animation
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            focusRing.style.left = `${x}px`;
            focusRing.style.top = `${y}px`;
            focusRing.style.opacity = '1';
            focusRing.style.transform = 'translate(-50%, -50%) scale(1)';

            try {
                // Point focus requires focusMode to be 'manual' or 'single-shot'
                await track.applyConstraints({
                    advanced: [{
                        focusMode: "manual",
                        pointsOfInterest: [{ x: x / rect.width, y: y / rect.height }]
                    }]
                });
                isFocusLocked = true;
                focusBtn.innerText = "Focus: Locked";
                focusBtn.classList.add('active');
            } catch (err) {
                console.warn("Point focus not supported on this browser/device.");
            }

            setTimeout(() => { focusRing.style.opacity = '0'; focusRing.style.transform = 'translate(-50%, -50%) scale(2)'; }, 1000);
        }

        // --- MOTION LOGIC ---

        function clearHeatmap() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function processFrame() {
            if (!isRunning) return;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const currentImageData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = currentImageData.data;

            if (prevImageData) {
                const heatmapImgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const heatmapPixels = heatmapImgData.data;
                const thresh = document.getElementById('threshold').value;
                const intens = document.getElementById('intensity').value;

                for (let i = 0; i < pixels.length; i += 4) {
                    const diff = (Math.abs(pixels[i] - prevImageData.data[i]) +
                        Math.abs(pixels[i + 1] - prevImageData.data[i + 1]) +
                        Math.abs(pixels[i + 2] - prevImageData.data[i + 2])) / 3;

                    if (diff > thresh) {
                        heatmapPixels[i] = 255;
                        heatmapPixels[i + 1] = Math.min(255, heatmapPixels[i + 1] + 25);
                        heatmapPixels[i + 3] = intens;
                    }
                }
                ctx.putImageData(heatmapImgData, 0, 0);
            }
            prevImageData = currentImageData;
            requestAnimationFrame(processFrame);
        }

        // Update value displays
        document.getElementById('threshold').oninput = (e) => document.getElementById('v-thresh').innerText = e.target.value;
        document.getElementById('intensity').oninput = (e) => document.getElementById('v-intens').innerText = e.target.value;

        startCamera();
    </script>
</body>

</html>

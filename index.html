<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motion Tracking</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        canvas, video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #motionCanvas { z-index: 10; mix-blend-mode: screen; pointer-events: none; }

        #focus-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #00ff88;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(2);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 15;
            pointer-events: none;
        }

        .controls {
            margin-top: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
        }

        .full-width { grid-column: span 2; }

        label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] { width: 100%; accent-color: #00ff88; margin: 5px 0; }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            background: #3d3d3d;
            color: white;
            -webkit-appearance: none;
        }

        button:active { background: #555; }
        button.active { background: #00ff88; color: black; }
        .btn-power { background: #ff453a; }
        .btn-power.on { background: #32d74b; color: black; }
    </style>
</head>
<body>

    <div class="container" id="video-wrapper" onclick="handleTapToFocus(event)">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="motionCanvas"></canvas>
        <div id="focus-ring"></div>
    </div>

    <div class="controls">
        <div class="full-width">
            <label>Sensitivity <span id="v-thresh">30</span></label>
            <input type="range" id="threshold" min="5" max="100" value="30">
        </div>
        
        <button id="torchBtn" onclick="toggleTorch()">Torch: OFF</button>
        <button id="focusBtn" onclick="toggleFocusMode()">Focus: Auto</button>
        
        <button onclick="clearHeatmap()">Clear Heat</button>
        <button id="powerBtn" class="btn-power" onclick="togglePower()">Camera: OFF</button>
        
        <div class="full-width">
            <label>Heat Intensity <span id="v-intens">150</span></label>
            <input type="range" id="intensity" min="50" max="255" value="150">
        </div>
    </div>

    <script id="workerCode" type="javascript/worker">
        let prevPixels = null;

        self.onmessage = function(e) {
            const { curr, thresh, intens, width, height } = e.data;
            const motionIndices = [];

            if (prevPixels) {
                for (let i = 0; i < curr.length; i += 4) {
                    const diff = (Math.abs(curr[i] - prevPixels[i]) + 
                                  Math.abs(curr[i+1] - prevPixels[i+1]) + 
                                  Math.abs(curr[i+2] - prevPixels[i+2])) / 3;
                    if (diff > thresh) {
                        motionIndices.push(i);
                    }
                }
            }
            prevPixels = curr;
            // Send back only the indices that moved to keep communication fast
            self.postMessage({ motionIndices, intens });
        };
    </script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const powerBtn = document.getElementById('powerBtn');
        const torchBtn = document.getElementById('torchBtn');
        const focusBtn = document.getElementById('focusBtn');
        const focusRing = document.getElementById('focus-ring');

        let stream = null;
        let track = null;
        let isRunning = false;
        let workerBusy = false;

        // Setup Worker
        const blob = new Blob([document.getElementById('workerCode').textContent], { type: 'text/javascript' });
        const worker = new Worker(URL.createObjectURL(blob));

        worker.onmessage = (e) => {
            const { motionIndices, intens } = e.data;
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < motionIndices.length; i++) {
                const idx = motionIndices[i];
                data[idx] = 255;
                data[idx + 1] = Math.min(255, data[idx + 1] + 25);
                data[idx + 2] = 0;
                data[idx + 3] = intens;
            }
            ctx.putImageData(imgData, 0, 0);
            workerBusy = false;
        };

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 } }
                });
                video.srcObject = stream;
                track = stream.getVideoTracks()[0];
                await video.play();
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                isRunning = true;
                powerBtn.innerText = "Camera: ON";
                powerBtn.classList.add('on');
                requestAnimationFrame(tick);
            } catch (err) { alert("Camera Error"); }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            isRunning = false;
            powerBtn.innerText = "Camera: OFF";
            powerBtn.classList.remove('on');
        }

        function togglePower() { isRunning ? stopCamera() : startCamera(); }

        function tick() {
            if (!isRunning) return;

            if (!workerBusy && video.readyState === video.HAVE_ENOUGH_DATA) {
                workerBusy = true;
                const tempCanvas = new OffscreenCanvas(canvas.width, canvas.height);
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(video, 0, 0);
                const currData = tCtx.getImageData(0, 0, canvas.width, canvas.height).data;

                worker.postMessage({
                    curr: currData,
                    thresh: document.getElementById('threshold').value,
                    intens: document.getElementById('intensity').value,
                    width: canvas.width,
                    height: canvas.height
                }, [currData.buffer]); // Zero-copy transfer
            }
            requestAnimationFrame(tick);
        }

        // Camera Logic
        async function toggleTorch() {
            if (!track) return;
            const cur = track.getConstraints().advanced?.[0]?.torch || false;
            await track.applyConstraints({ advanced: [{ torch: !cur }] });
            torchBtn.classList.toggle('active', !cur);
            torchBtn.innerText = !cur ? "Torch: ON" : "Torch: OFF";
        }

        async function toggleFocusMode() {
            if (!track) return;
            const cur = track.getConstraints().advanced?.[0]?.focusMode === 'manual';
            await track.applyConstraints({ advanced: [{ focusMode: cur ? 'continuous' : 'manual' }] });
            focusBtn.innerText = cur ? "Focus: Auto" : "Focus: Locked";
            focusBtn.classList.toggle('active', !cur);
        }

        async function handleTapToFocus(e) {
            if (!track) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            focusRing.style.left = `${e.clientX - rect.left}px`;
            focusRing.style.top = `${e.clientY - rect.top}px`;
            focusRing.style.opacity = '1';
            focusRing.style.transform = 'translate(-50%, -50%) scale(1)';
            await track.applyConstraints({ advanced: [{ focusMode: "manual", pointsOfInterest: [{x, y}] }] });
            focusBtn.innerText = "Focus: Locked";
            focusBtn.classList.add('active');
            setTimeout(() => focusRing.style.opacity = '0', 1000);
        }

        function clearHeatmap() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        document.getElementById('threshold').oninput = (e) => document.getElementById('v-thresh').innerText = e.target.value;
        document.getElementById('intensity').oninput = (e) => document.getElementById('v-intens').innerText = e.target.value;

        startCamera();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motion Tracker</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        canvas, video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #motionCanvas {
            z-index: 10;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        #focus-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #00ff88;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(2);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 15;
            pointer-events: none;
        }

        .controls {
            margin-top: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 640px;
            box-sizing: border-box;
        }

        .full-width { grid-column: span 2; }

        label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] { width: 100%; accent-color: #00ff88; margin: 5px 0; }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            background: #3d3d3d;
            color: white;
        }

        button.active { background: #00ff88; color: black; }
        .btn-power { background: #ff453a; }
        .btn-power.on { background: #32d74b; color: black; }
        
        #fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
            z-index: 20;
        }
    </style>
</head>

<body>

    <div class="container" id="video-wrapper" onclick="handleTapToFocus(event)">
        <div id="fps-counter">FPS: <span id="fps-val">0</span></div>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="motionCanvas"></canvas>
        <div id="focus-ring"></div>
    </div>

    <div class="controls">
        <div class="full-width">
            <label>Sensitivity <span id="v-thresh">30</span></label>
            <input type="range" id="threshold" min="5" max="100" value="30">
        </div>
        
        <button id="torchBtn" onclick="toggleTorch()">Torch: OFF</button>
        <button id="focusBtn" onclick="toggleFocusMode()">Focus: Auto</button>
        
        <button onclick="clearHeatmap()">Clear Heat</button>
        <button id="powerBtn" class="btn-power" onclick="togglePower()">Camera: OFF</button>
        
        <div class="full-width">
            <label>Heat Intensity <span id="v-intens">150</span></label>
            <input type="range" id="intensity" min="50" max="255" value="150">
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const powerBtn = document.getElementById('powerBtn');
        const torchBtn = document.getElementById('torchBtn');
        const focusBtn = document.getElementById('focusBtn');
        const focusRing = document.getElementById('focus-ring');
        const fpsVal = document.getElementById('fps-val');

        let prevPixels = null;
        let stream = null;
        let track = null;
        let isRunning = false;
        let isProcessing = false; // Flag to prevent overlap
        let lastFrameTime = 0;

        // Persistent offscreen buffer to avoid re-creating canvas every frame (Huge Speed Up)
        const bufferCanvas = document.createElement('canvas');
        const bCtx = bufferCanvas.getContext('2d', { willReadFrequently: true });

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 } },
                    audio: false
                });
                video.srcObject = stream;
                track = stream.getVideoTracks()[0];
                await video.play();
                
                canvas.width = bufferCanvas.width = video.videoWidth;
                canvas.height = bufferCanvas.height = video.videoHeight;

                isRunning = true;
                powerBtn.innerText = "Camera: ON";
                powerBtn.classList.add('on');
                requestAnimationFrame(tick);
            } catch (err) { alert("Camera Error"); }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            isRunning = false;
            powerBtn.innerText = "Camera: OFF";
            powerBtn.classList.remove('on');
        }

        function togglePower() { isRunning ? stopCamera() : startCamera(); }

        // --- Optimized Processing Logic ---
        function tick(now) {
            if (!isRunning) return;

            // Performance Monitoring
            fpsVal.innerText = Math.round(1000 / (now - lastFrameTime));
            lastFrameTime = now;

            // Only process if the previous frame's math is finished
            if (!isProcessing && video.readyState === video.HAVE_ENOUGH_DATA) {
                isProcessing = true;
                
                // Draw current frame to offscreen buffer
                bCtx.drawImage(video, 0, 0);
                const currentData = bCtx.getImageData(0, 0, canvas.width, canvas.height);
                const curr = currentData.data;

                if (prevPixels) {
                    const heatmapData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const hPixels = heatmapData.data;
                    const thresh = document.getElementById('threshold').value;
                    const intens = document.getElementById('intensity').value;

                    // Optimized Loop
                    for (let i = 0; i < curr.length; i += 4) {
                        const diff = (Math.abs(curr[i] - prevPixels[i]) + 
                                      Math.abs(curr[i+1] - prevPixels[i+1]) + 
                                      Math.abs(curr[i+2] - prevPixels[i+2])) / 3;

                        if (diff > thresh) {
                            hPixels[i] = 255; 
                            hPixels[i+1] = Math.min(255, hPixels[i+1] + 25); 
                            hPixels[i+3] = intens;
                        }
                    }
                    ctx.putImageData(heatmapData, 0, 0);
                }
                
                // Store copy for next comparison
                prevPixels = new Uint8ClampedArray(curr);
                isProcessing = false;
            }
            
            requestAnimationFrame(tick);
        }

        // --- Camera Intelligence ---
        async function toggleTorch() {
            if (!track) return;
            const caps = track.getCapabilities();
            if (!caps.torch) return alert("No Torch");
            const cur = track.getConstraints().advanced?.[0]?.torch || false;
            await track.applyConstraints({ advanced: [{ torch: !cur }] });
            torchBtn.classList.toggle('active', !cur);
        }

        async function toggleFocusMode() {
            if (!track) return;
            const cur = track.getConstraints().advanced?.[0]?.focusMode === 'manual';
            await track.applyConstraints({ advanced: [{ focusMode: cur ? 'continuous' : 'manual' }] });
            focusBtn.innerText = cur ? "Focus: Auto" : "Focus: Locked";
            focusBtn.classList.toggle('active', !cur);
        }

        async function handleTapToFocus(e) {
            if (!track) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            
            focusRing.style.left = `${e.clientX - rect.left}px`;
            focusRing.style.top = `${e.clientY - rect.top}px`;
            focusRing.style.opacity = '1';
            focusRing.style.transform = 'translate(-50%, -50%) scale(1)';

            await track.applyConstraints({ advanced: [{ focusMode: "manual", pointsOfInterest: [{x, y}] }] });
            focusBtn.innerText = "Focus: Locked";
            focusBtn.classList.add('active');
            setTimeout(() => { focusRing.style.opacity = '0'; focusRing.style.transform = 'translate(-50%, -50%) scale(2)'; }, 800);
        }

        function clearHeatmap() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        document.getElementById('threshold').oninput = (e) => document.getElementById('v-thresh').innerText = e.target.value;
        document.getElementById('intensity').oninput = (e) => document.getElementById('v-intens').innerText = e.target.value;

        startCamera();
    </script>
</body>
</html>
